[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 5173

[[redirects]]
  from = "/api/scrape-start"
  to = "/.netlify/functions/scrape-start"
  status = 200

[[redirects]]
  from = "/api/scrape-poll"
  to = "/.netlify/functions/scrape-poll"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  node_bundler = "esbuild"
